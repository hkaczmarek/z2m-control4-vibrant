name: "Control4 Vibrant Firmware"
version: "0.2.1"
slug: "control4_vibrant_firmware"
description: "Keeps Zigbee2MQTT's update list current with Control4 Vibrant bulb firmware, downloaded from Control4's public driver site"
url: "https://github.com/hkaczmarek/z2m-control4-vibrant"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
map:
  - type: homeassistant_config
    read_only: false
options:
  zigbee2mqtt_data_dir: "/homeassistant/zigbee2mqtt"
  check_interval_hours: 24
  merge_indexes: []
schema:
  zigbee2mqtt_data_dir: str
  check_interval_hours: int(1,168)
  merge_indexes:
    - str
